# stdout carries the JSON-RPC messages: no web server, no banner, no console logging
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.console.enabled=false

spring.ai.mcp.server.name=minicpp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=Tools for MiniC++, a small subset of C++. Before suggesting MiniC++ code, \
  validate it with 'check' and, for complete programs, execute it with 'run'; the compiler is the ground \
  truth for what MiniC++ supports.
